version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # baked into the browser bundle when the image is built (see client/Dockerfile)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - server
    networks:
      - dhaka_tesla_pool_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DB_STORAGE_PATH=./data/database.sqlite
      # Required, and never written in this file: docker compose reads it from the environment or from a .env file
      # next to this one (see .env.example). Generate one with: openssl rand -base64 32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is not set. Generate one with 'openssl rand -base64 32' and put it in .env next to docker-compose.yml, or export it}
    volumes:
      - ./server/data:/app/data
    networks:
      - dhaka_tesla_pool_network

networks:
  dhaka_tesla_pool_network:
    driver: bridge
